name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI never touches a real database. Production/staging migrations are a deliberate release step
# (see "Release Path" in README.md), not something that runs on every push.

jobs:
  validate:
    name: Type-check, lint, tenant audit, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        # apps/api: strict rules, existing debt recorded in apps/api/.eslint-baseline.json; new problems fail.
        run: npm run lint

      - name: Tenant filter audit
        # Fails only on unfiltered queries that are not in scripts/audit-tenant-filter.baseline.json.
        run: npm run audit:tenant-filter

      - name: Duplicate helper check
        # Fails when a top-level function name is defined in more than one non-test file of apps/api/src,
        # apps/web/src or packages/shared/src (or in more than one of them) and is not allowlisted with a reason.
        run: npm run check:duplicates

      - name: Build
        run: npm run build

  test:
    name: Tests (with throwaway Postgres) and coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dashboarduz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Only this job-local container. The integration harness refuses database names without "test".
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dashboarduz_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Migrate the test database
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        # Applies every migration from zero, including the RLS / constraint migrations under packages/db.
        run: npx prisma migrate deploy --schema=packages/db/prisma/schema.prisma

      - name: Check schema drift
        # Fails if the migrated database and schema.prisma disagree (a model change without a migration).
        run: >-
          npx prisma migrate diff
          --from-url "$TEST_DATABASE_URL"
          --to-schema-datamodel packages/db/prisma/schema.prisma
          --exit-code

      - name: RLS isolation test
        # Applies packages/db/scripts/rls-enforce.sql to this throwaway database and checks that the tenant-scoped
        # client (forTenant / ctx.db) cannot read or write another tenant's rows. Runs on its own so a skip or
        # failure is visible; it is excluded from the coverage run below.
        working-directory: apps/api
        run: npx jest --ci --coverage=false src/__tests__/rls-isolation.integration.test.ts

      - name: Run tests with coverage
        # Includes the money-path integration tests (apps/api/src/__tests__/integration), which use the same
        # TEST_DATABASE_URL.
        # The ignore pattern is passed to apps/api only: on the CLI it replaces a config's own testPathIgnorePatterns,
        # and apps/web has one.
        run: |
          npm run test:coverage --workspace @dashboarduz/api -- --testPathIgnorePatterns /node_modules/ rls-isolation
          npm run test:coverage --workspace @dashboarduz/web

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Coverage"
            for ws in apps/api apps/web; do
              f="$ws/coverage/coverage-summary.json"
              if [ -f "$f" ]; then
                node -e "const t=require('./$f').total; console.log('**$ws**: ' + ['lines','statements','functions','branches'].map(k => k + ' ' + t[k].pct + '%').join(', '))"
              else
                echo "**$ws**: no coverage summary"
              fi
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
